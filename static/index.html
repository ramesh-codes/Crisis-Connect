<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CrisisConnect — Rapid Disaster Response</title>
<style>
  :root {
    --red: #E24B4A; --red-light: #FCEBEB; --red-dark: #A32D2D;
    --amber: #BA7517; --amber-light: #FAEEDA; --amber-dark: #633806;
    --green: #3B6D11; --green-light: #EAF3DE; --green-dark: #27500A;
    --blue: #185FA5; --blue-light: #E6F1FB; --blue-dark: #0C447C;
    --gray: #3d3d3a; --gray-light: #F1EFE8; --gray-mid: #888780;
    --bg: #ffffff; --surface: #F7F6F2; --border: rgba(0,0,0,0.12);
    --text: #1a1a18; --text-muted: #5F5E5A;
    --radius: 12px; --shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: var(--surface); color: var(--text); min-height: 100vh; }

  /* Header */
  header { background: var(--red-dark); color: white; padding: 14px 24px; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); position: sticky; top: 0; z-index: 100; }
  .logo { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
  .logo span { color: #FCDE5A; }
  .header-sub { font-size: 12px; opacity: 0.8; margin-left: auto; }
  .live-dot { width: 8px; height: 8px; background: #4ade80; border-radius: 50%; animation: pulse 1.5s infinite; display: inline-block; margin-right: 6px; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* Layout */
  .container { max-width: 1100px; margin: 0 auto; padding: 24px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 700px) { .container { grid-template-columns: 1fr; } }

  /* Cards */
  .card { background: var(--bg); border-radius: var(--radius); border: 1px solid var(--border); padding: 20px; box-shadow: var(--shadow); }
  .card-title { font-size: 15px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .card-title .icon { font-size: 18px; }

  /* Form */
  label { display: block; font-size: 13px; font-weight: 500; color: var(--text-muted); margin-bottom: 5px; }
  select, input, textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit; background: var(--surface); color: var(--text); transition: border-color .2s; }
  select:focus, input:focus, textarea:focus { outline: none; border-color: var(--red); }
  textarea { resize: vertical; min-height: 80px; }
  .form-row { margin-bottom: 14px; }
  .severity-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* Button */
  .btn-submit { width: 100%; padding: 12px; background: var(--red-dark); color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background .2s, transform .1s; margin-top: 4px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-submit:hover { background: #911f1f; }
  .btn-submit:active { transform: scale(0.98); }
  .btn-submit:disabled { background: var(--gray-mid); cursor: not-allowed; }

  /* Loading spinner */
  .spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.4); border-top-color: white; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Response panel */
  #response-panel { display: none; }
  .severity-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
  .sev-LOW { background: var(--green-light); color: var(--green-dark); }
  .sev-MEDIUM { background: var(--amber-light); color: var(--amber-dark); }
  .sev-HIGH { background: #FEF3C7; color: #92400E; }
  .sev-CRITICAL { background: var(--red-light); color: var(--red-dark); }

  .response-section { margin-top: 14px; }
  .response-section h4 { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  .action-list { list-style: none; }
  .action-list li { padding: 7px 10px; background: var(--surface); border-radius: 6px; margin-bottom: 5px; font-size: 13px; display: flex; gap: 8px; align-items: flex-start; border-left: 3px solid var(--red); }
  .action-list li::before { content: "→"; color: var(--red-dark); font-weight: 700; flex-shrink: 0; }
  .resource-tag { display: inline-block; background: var(--blue-light); color: var(--blue-dark); border-radius: 6px; padding: 4px 10px; font-size: 12px; margin: 3px 3px 3px 0; }
  .contact-tag { display: inline-block; background: var(--green-light); color: var(--green-dark); border-radius: 6px; padding: 4px 10px; font-size: 12px; margin: 3px 3px 3px 0; font-weight: 500; }
  .summary-box { background: var(--blue-light); border-radius: 8px; padding: 12px 14px; font-size: 13px; line-height: 1.6; color: var(--blue-dark); border-left: 3px solid var(--blue); }
  .evac-alert { background: var(--red-light); border: 1px solid var(--red); border-radius: 8px; padding: 10px 14px; font-size: 13px; font-weight: 600; color: var(--red-dark); display: flex; align-items: center; gap: 8px; }
  .affected-stat { font-size: 22px; font-weight: 700; color: var(--red-dark); }
  .affected-label { font-size: 12px; color: var(--text-muted); }

  /* Alert feed */
  #alert-feed { grid-column: 1 / -1; }
  .alert-item { padding: 12px 14px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 8px; display: flex; align-items: center; gap: 12px; background: var(--surface); transition: background .2s; }
  .alert-item:hover { background: var(--gray-light); }
  .alert-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .alert-dot.ACTIVE { background: var(--red); animation: pulse 1.5s infinite; }
  .alert-dot.RESOLVED { background: var(--green); }
  .alert-info { flex: 1; }
  .alert-type { font-size: 14px; font-weight: 600; }
  .alert-loc { font-size: 12px; color: var(--text-muted); }
  .alert-time { font-size: 11px; color: var(--gray-mid); }
  .btn-resolve { padding: 5px 12px; background: transparent; border: 1px solid var(--green); color: var(--green); border-radius: 6px; font-size: 12px; cursor: pointer; transition: all .2s; }
  .btn-resolve:hover { background: var(--green); color: white; }
  .empty-state { text-align: center; padding: 32px; color: var(--text-muted); font-size: 14px; }

  /* Stats bar */
  .stats-bar { grid-column: 1 / -1; display: flex; gap: 12px; }
  .stat-card { flex: 1; background: var(--bg); border-radius: var(--radius); border: 1px solid var(--border); padding: 14px 16px; text-align: center; }
  .stat-num { font-size: 28px; font-weight: 700; }
  .stat-label { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .stat-red .stat-num { color: var(--red-dark); }
  .stat-amber .stat-num { color: var(--amber); }
  .stat-green .stat-num { color: var(--green); }

  /* Alert id badge */
  .alert-id { font-size: 11px; background: var(--gray-light); border-radius: 4px; padding: 2px 7px; color: var(--text-muted); font-family: monospace; }
</style>
</head>
<body>

<header>
  <div class="logo">Crisis<span>Connect</span></div>
  <div style="font-size:13px;opacity:0.85;">Rapid Disaster Response Platform</div>
  <div class="header-sub"><span class="live-dot"></span>AI-Powered · India</div>
</header>

<div class="container">

  <!-- Stats -->
  <div class="stats-bar">
    <div class="stat-card stat-red"><div class="stat-num" id="stat-active">0</div><div class="stat-label">Active Alerts</div></div>
    <div class="stat-card stat-amber"><div class="stat-num" id="stat-total">0</div><div class="stat-label">Total Reports</div></div>
    <div class="stat-card stat-green"><div class="stat-num" id="stat-resolved">0</div><div class="stat-label">Resolved</div></div>
  </div>

  <!-- Report Form -->
  <div class="card">
    <div class="card-title"><span class="icon">🚨</span> Report a Disaster</div>

    <div class="form-row">
      <label>Disaster Type</label>
      <select id="disaster-type">
        <option value="">Select type...</option>
        <option value="Flood">🌊 Flood</option>
        <option value="Earthquake">🌏 Earthquake</option>
        <option value="Cyclone">🌀 Cyclone</option>
        <option value="Landslide">⛰️ Landslide</option>
        <option value="Fire">🔥 Fire</option>
        <option value="Industrial Accident">🏭 Industrial Accident</option>
        <option value="Building Collapse">🏚️ Building Collapse</option>
        <option value="Chemical Spill">☣️ Chemical Spill</option>
      </select>
    </div>

    <div class="form-row severity-row">
      <div>
        <label>Location / District</label>
        <input type="text" id="location" placeholder="e.g. Assam, Kamrup district">
      </div>
      <div>
        <label>Severity</label>
        <select id="severity">
          <option value="Low">Low</option>
          <option value="Medium" selected>Medium</option>
          <option value="High">High</option>
          <option value="Critical">Critical</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <label>Description</label>
      <textarea id="description" placeholder="Describe the situation — number of people affected, current conditions, infrastructure damage..."></textarea>
    </div>

    <button class="btn-submit" id="submit-btn" onclick="submitReport()">
      <span id="btn-text">Analyze & Generate Response Plan</span>
    </button>
  </div>

  <!-- Response Panel -->
  <div class="card" id="response-panel">
    <div class="card-title"><span class="icon">🤖</span> AI Response Plan <span id="response-alert-id" class="alert-id"></span></div>
    <div id="response-content"></div>
  </div>

  <!-- Alert Feed -->
  <div class="card" id="alert-feed">
    <div class="card-title"><span class="icon">📡</span> Active Alert Feed</div>
    <div id="feed-content"><div class="empty-state">No alerts yet. Submit a report to begin.</div></div>
  </div>

</div>

<script>
const API = '';

async function submitReport() {
  const type = document.getElementById('disaster-type').value;
  const location = document.getElementById('location').value;
  const desc = document.getElementById('description').value;
  const severity = document.getElementById('severity').value;

  if (!type || !location) {
    alert('Please select a disaster type and enter a location.');
    return;
  }

  const btn = document.getElementById('submit-btn');
  const btnText = document.getElementById('btn-text');
  btn.disabled = true;
  btnText.innerHTML = '';
  btn.innerHTML = '<div class="spinner"></div> Analyzing with Gemini AI...';

  try {
    const res = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ disaster_type: type, location, description: desc, severity })
    });
    const data = await res.json();
    showResponse(data);
    loadAlerts();
  } catch (e) {
    alert('Error connecting to server: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<span id="btn-text">Analyze & Generate Response Plan</span>';
  }
}

function showResponse(data) {
  const panel = document.getElementById('response-panel');
  const content = document.getElementById('response-content');
  const idBadge = document.getElementById('response-alert-id');
  panel.style.display = 'block';
  idBadge.textContent = '#' + data.alert_id;

  const a = data.analysis;
  const sev = a.severity || 'MEDIUM';

  let html = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
      <span class="severity-badge sev-${sev}">${sev}</span>
      <div><div class="affected-stat">${a.estimated_affected || 'Unknown'}</div><div class="affected-label">Estimated Affected</div></div>
      ${a.evacuation_required ? '<div class="evac-alert" style="flex:1">⚠️ EVACUATION REQUIRED</div>' : ''}
    </div>

    <div class="summary-box">${a.summary || ''}</div>

    <div class="response-section">
      <h4>Immediate Actions</h4>
      <ul class="action-list">
        ${(a.immediate_actions || []).map(x => `<li>${x}</li>`).join('')}
      </ul>
    </div>

    <div class="response-section">
      <h4>Resources Needed</h4>
      <div>${(a.resources_needed || []).map(r => `<span class="resource-tag">${r}</span>`).join('')}</div>
    </div>

    <div class="response-section">
      <h4>Emergency Contacts</h4>
      <div>${(a.key_contacts || []).map(c => `<span class="contact-tag">📞 ${c}</span>`).join('')}</div>
    </div>
  `;

  content.innerHTML = html;
  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function loadAlerts() {
  try {
    const res = await fetch('/api/alerts');
    const alerts = await res.json();
    renderFeed(alerts);
    updateStats(alerts);
  } catch (e) {}
}

function renderFeed(alerts) {
  const feed = document.getElementById('feed-content');
  if (!alerts.length) {
    feed.innerHTML = '<div class="empty-state">No alerts yet. Submit a report to begin.</div>';
    return;
  }

  const sevColor = { LOW: '#639922', MEDIUM: '#BA7517', HIGH: '#E85D24', CRITICAL: '#A32D2D' };

  feed.innerHTML = alerts.slice().reverse().map(a => `
    <div class="alert-item">
      <div class="alert-dot ${a.status}"></div>
      <div class="alert-info">
        <div class="alert-type">${a.disaster_type} <span class="alert-id">#${a.id}</span></div>
        <div class="alert-loc">📍 ${a.location} · <span style="color:${sevColor[a.ai_response?.severity] || '#888'};font-weight:600">${a.ai_response?.severity || a.severity_reported}</span></div>
      </div>
      <div class="alert-time">${formatTime(a.timestamp)}</div>
      ${a.status === 'ACTIVE' ? `<button class="btn-resolve" onclick="resolveAlert('${a.id}')">✓ Resolve</button>` : '<span style="font-size:12px;color:var(--green);font-weight:600">✓ Resolved</span>'}
    </div>
  `).join('');
}

function updateStats(alerts) {
  const active = alerts.filter(a => a.status === 'ACTIVE').length;
  const resolved = alerts.filter(a => a.status === 'RESOLVED').length;
  document.getElementById('stat-active').textContent = active;
  document.getElementById('stat-total').textContent = alerts.length;
  document.getElementById('stat-resolved').textContent = resolved;
}

async function resolveAlert(id) {
  await fetch(`/api/alerts/${id}/resolve`, { method: 'POST' });
  loadAlerts();
}

function formatTime(iso) {
  const d = new Date(iso);
  const now = new Date();
  const diff = Math.floor((now - d) / 60000);
  if (diff < 1) return 'Just now';
  if (diff < 60) return `${diff}m ago`;
  return d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
}

// Auto-refresh feed every 30 seconds
loadAlerts();
setInterval(loadAlerts, 30000);
</script>
</body>
</html>
